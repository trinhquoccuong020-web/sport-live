<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sport Live</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0} :root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--primary:#16a34a;--primary-dark:#15803d;--input:#f9fafb;--danger:#dc2626}body.dark{--bg:#0b1120;--card:#111827;--text:#f3f4f6;--muted:#9ca3af;--border:#253047;--input:#182235}body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:.2s}button,input{font:inherit}button{cursor:pointer}
header{height:68px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:18px;padding:0 24px;position:sticky;top:0;z-index:100}.logo{font-size:24px;font-weight:800;color:var(--primary);white-space:nowrap}.search{flex:1;max-width:650px;position:relative}.search input{width:100%;height:42px;border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:12px;padding:0 16px 0 42px;outline:none}.search input:focus{border-color:var(--primary)}.search-icon{position:absolute;left:15px;top:11px;color:var(--muted)}.header-actions{margin-left:auto;display:flex;gap:10px;align-items:center}.icon-btn{width:42px;height:42px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px}.login-btn{border:none;background:var(--primary);color:#fff;padding:11px 17px;border-radius:10px;font-weight:700}.login-btn:hover{background:var(--primary-dark)}
.layout{display:flex;min-height:calc(100vh - 68px)}aside{width:245px;background:var(--card);border-right:1px solid var(--border);padding:22px 14px;position:sticky;top:68px;height:calc(100vh - 68px);overflow-y:auto}.side-title{font-size:12px;font-weight:800;color:var(--muted);margin:8px 12px;text-transform:uppercase}.nav-item{width:100%;display:flex;align-items:center;gap:12px;border:none;background:transparent;color:var(--text);padding:12px;border-radius:10px;margin-bottom:3px;text-align:left}.nav-item:hover,.nav-item.active{background:rgba(22,163,74,.12);color:var(--primary)}main{flex:1;min-width:0;padding:28px}.hero{background:linear-gradient(135deg,rgba(22,163,74,.95),rgba(5,150,105,.82)),url("https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=1600&q=80") center/cover;border-radius:22px;padding:42px;color:#fff;min-height:245px;display:flex;align-items:center;margin-bottom:28px}.hero h1{font-size:clamp(32px,5vw,54px);margin-bottom:12px}.hero p{font-size:17px;opacity:.92;max-width:650px;line-height:1.6}.section{margin-bottom:32px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;gap:15px}.section-head h2{font-size:22px}.sports{display:flex;gap:12px;overflow-x:auto;padding-bottom:5px}.sport{min-width:115px;padding:16px 13px;background:var(--card);border:1px solid var(--border);border-radius:15px;color:var(--text);text-align:center;transition:.2s}.sport:hover,.sport.active{border-color:var(--primary);transform:translateY(-2px)}.sport-icon{font-size:30px;display:block;margin-bottom:8px}.matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}.match{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;transition:.2s}.match:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.07)}.match-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:18px}.live{color:var(--danger);font-weight:800}.team{display:flex;justify-content:space-between;align-items:center;margin:13px 0;font-weight:700}.score{font-size:20px}.match-bottom{margin-top:15px;padding-top:13px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}.empty{background:var(--card);border:1px dashed var(--border);border-radius:16px;padding:35px;text-align:center;color:var(--muted)}
.page-title{font-size:30px;margin-bottom:8px}.page-sub{color:var(--muted);margin-bottom:24px;line-height:1.5}.panel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px}.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}.panel h3{margin-bottom:8px}.panel p{color:var(--muted);font-size:14px;line-height:1.5}.favorite-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px;margin-bottom:10px}.favorite-card .info{display:flex;gap:12px;align-items:center}.fav-icon{font-size:28px}.remove-btn{border:1px solid var(--border);background:transparent;color:var(--danger);padding:8px 11px;border-radius:9px}.sport-fav{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--card);color:var(--text);padding:12px 15px;border-radius:12px;margin:0 8px 8px 0}.sport-fav.active{border-color:var(--primary);color:var(--primary)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}.modal.show{display:flex}.modal-box{width:100%;max-width:430px;background:var(--card);border-radius:20px;padding:28px;position:relative;max-height:90vh;overflow:auto}.close{position:absolute;right:18px;top:15px;border:none;background:transparent;color:var(--muted);font-size:25px}.modal-box h2{margin-bottom:8px}.modal-sub{color:var(--muted);margin-bottom:22px;font-size:14px}.form-group{margin-bottom:14px}.form-group label{display:block;margin-bottom:6px;font-size:14px;font-weight:700}.form-group input{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--input);color:var(--text);outline:none}.form-submit{width:100%;padding:13px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-weight:800;margin-top:8px}.switch{text-align:center;margin-top:18px;font-size:14px;color:var(--muted)}.switch button{border:none;background:none;color:var(--primary);font-weight:700}.message{margin-top:12px;font-size:14px;text-align:center;line-height:1.5}.user-menu{display:none;position:absolute;right:24px;top:58px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px;width:190px;box-shadow:0 15px 40px rgba(0,0,0,.15)}.user-menu.show{display:block}.user-menu button{width:100%;padding:11px;border:none;border-radius:9px;background:transparent;color:var(--text);text-align:left}.user-menu button:hover{background:var(--bg)}
@media(max-width:800px){aside{display:none}main{padding:18px}header{padding:0 14px;gap:10px}.logo{font-size:20px}.search{display:none}.hero{padding:28px;min-height:210px}.hero h1{font-size:34px}.login-btn{padding:9px 12px}.page-title{font-size:26px}}
</style>
</head>
<body>
<header><div class="logo">⚡ Sport Live</div><div class="search"><span class="search-icon">🔎</span><input id="searchInput" type="text" placeholder="Tìm đội bóng, giải đấu, cầu thủ..."></div><div class="header-actions"><button class="icon-btn" id="themeBtn" title="Đổi giao diện">🌙</button><button class="login-btn" id="accountBtn">Đăng nhập</button></div><div class="user-menu" id="userMenu"><button id="profileBtn">👤 Hồ sơ</button><button id="logoutBtn">🚪 Đăng xuất</button></div></header>
<div class="layout"><aside><div class="side-title">Khám phá</div><button class="nav-item active" data-page="home">🏠 Trang chủ</button><button class="nav-item" data-page="live">🔴 Đang diễn ra</button><button class="nav-item" data-page="schedule">📅 Lịch thi đấu</button><button class="nav-item" data-page="leagues">🏆 Giải đấu</button><button class="nav-item" data-page="teams">👥 Đội / CLB</button><div class="side-title" style="margin-top:25px">Cá nhân</div><button class="nav-item" data-page="favorite-teams">⭐ Đội yêu thích</button><button class="nav-item" data-page="favorite-sports">❤️ Môn yêu thích</button></aside>
<main id="app"></main></div>

<div class="modal" id="authModal"><div class="modal-box"><button class="close" id="closeModal">×</button><h2 id="authTitle">Đăng nhập</h2><div class="modal-sub">Đăng nhập để lưu đội và môn thể thao yêu thích.</div><div class="form-group" id="nameGroup" style="display:none"><label>Tên hiển thị</label><input id="displayName" type="text" placeholder="Tên của bạn"></div><div class="form-group"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div><div class="form-group"><label>Mật khẩu</label><input id="password" type="password" placeholder="Mật khẩu"></div><button class="form-submit" id="authSubmit">Đăng nhập</button><div class="message" id="authMessage"></div><div class="switch"><span id="switchText">Chưa có tài khoản?</span> <button id="switchAuth">Đăng ký</button></div></div></div>
<div class="modal" id="profileModal"><div class="modal-box"><button class="close" id="closeProfile">×</button><h2>👤 Hồ sơ</h2><div class="modal-sub">Thông tin tài khoản Sport Live</div><div class="panel"><h3 id="profileName">Người dùng</h3><p id="profileEmail"></p><p id="profileId" style="margin-top:8px"></p></div><button class="form-submit" id="profileLogout" style="margin-top:16px">Đăng xuất</button></div></div>

<script>
const SUPABASE_URL="https://himojyfspmgcwdruesvx.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_wD9DwAlyxM3JLW8WM6n2JQ_kk6lK6pG";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const app=document.getElementById('app');
const themeBtn=document.getElementById('themeBtn');
const accountBtn=document.getElementById('accountBtn');
const userMenu=document.getElementById('userMenu');
const authModal=document.getElementById('authModal');
const profileModal=document.getElementById('profileModal');
let registerMode=false,currentPage='home',selectedSport='All',allMatches=[];

const sports=[['All','🌎','Tất cả'],['Soccer','⚽','Bóng đá'],['Tennis','🎾','Tennis'],['Basketball','🏀','Bóng rổ'],['Volleyball','🏐','Bóng chuyền'],['Hockey','🏒','Hockey'],['Baseball','⚾','Baseball'],['Motorsport','🏎️','Motorsport']];
allMatches=[
 {sport:'Soccer',icon:'⚽',status:'● LIVE',a:'Manchester City',b:'Arsenal',sa:'2',sb:'1',bottom:'Premier League · 72\''},
 {sport:'Basketball',icon:'🏀',status:'● LIVE',a:'Boston Celtics',b:'New York Knicks',sa:'87',sb:'82',bottom:'Basketball · Q3'},
 {sport:'Tennis',icon:'🎾',status:'Today',a:'Player A',b:'Player B',sa:'1',sb:'0',bottom:'Tennis · Set 2'}
];

function loadTheme(){const t=localStorage.getItem('sport-live-theme');document.body.classList.toggle('dark',t==='dark');themeBtn.textContent=t==='dark'?'☀️':'🌙'}
themeBtn.onclick=()=>{const dark=!document.body.classList.contains('dark');document.body.classList.toggle('dark',dark);localStorage.setItem('sport-live-theme',dark?'dark':'light');themeBtn.textContent=dark?'☀️':'🌙'};loadTheme();

function matchHTML(m){return `<div class="match" data-search="${m.sport} ${m.a} ${m.b} ${m.bottom}"><div class="match-top"><span>${m.icon} ${m.sport}</span><span class="${m.status.includes('LIVE')?'live':''}">${m.status}</span></div><div class="team"><span>${m.a}</span><span class="score">${m.sa}</span></div><div class="team"><span>${m.b}</span><span class="score">${m.sb}</span></div><div class="match-bottom">${m.bottom}</div></div>`}
function matchesHTML(list){if(!list.length)return '<div class="empty">Không có trận đấu phù hợp.</div>';return `<div class="matches">${list.map(matchHTML).join('')}</div>`}
function homePage(){return `<section class="hero"><div><h1>SPORT LIVE</h1><p>Theo dõi thể thao thế giới — bóng đá, tennis, bóng rổ, bóng chuyền và nhiều môn thể thao khác trên một nền tảng.</p></div></section><section class="section"><div class="section-head"><h2>Môn thể thao</h2></div><div class="sports">${sports.map(s=>`<button class="sport ${selectedSport===s[0]?'active':''}" data-sport="${s[0]}"><span class="sport-icon">${s[1]}</span>${s[2]}</button>`).join('')}</div></section><section class="section"><div class="section-head"><h2>Trận đấu nổi bật</h2></div><div id="homeMatches">${matchesHTML(selectedSport==='All'?allMatches:allMatches.filter(m=>m.sport===selectedSport))}</div></section>`}
function simplePage(title,sub,content){return `<h1 class="page-title">${title}</h1><p class="page-sub">${sub}</p>${content}`}
function renderPage(page=currentPage){currentPage=page;document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='home'){app.innerHTML=homePage();bindSports();return}if(page==='live'){app.innerHTML=simplePage('🔴 Đang diễn ra','Các trận đang được đánh dấu LIVE trong dữ liệu hiện tại.',matchesHTML(allMatches.filter(m=>m.status.includes('LIVE'))));return}if(page==='schedule'){app.innerHTML=simplePage('📅 Lịch thi đấu','Các trận đấu sắp tới và lịch thi đấu sẽ được kết nối dữ liệu thật ở bước API.',matchesHTML(allMatches));return}if(page==='leagues'){app.innerHTML=simplePage('🏆 Giải đấu','Khu vực giải đấu của Sport Live.',`<div class="panel-grid"><div class="panel"><h3>Premier League</h3><p>Football · Anh</p></div><div class="panel"><h3>Basketball</h3><p>Bóng rổ</p></div><div class="panel"><h3>Tennis</h3><p>ATP / WTA</p></div></div>`);return}if(page==='teams'){app.innerHTML=simplePage('👥 Đội / CLB','Tìm kiếm đội sẽ được nối với dữ liệu thể thao thật. Hiện tại đây là khu vực quản lý đội.',`<div class="panel-grid"><div class="panel"><h3>Manchester City</h3><p>⚽ Football</p><button class="form-submit" onclick="addFavoriteTeam('man-city','Manchester City','Soccer','Premier League','')">⭐ Thêm yêu thích</button></div><div class="panel"><h3>Arsenal</h3><p>⚽ Football</p><button class="form-submit" onclick="addFavoriteTeam('arsenal','Arsenal','Soccer','Premier League','')">⭐ Thêm yêu thích</button></div><div class="panel"><h3>Boston Celtics</h3><p>🏀 Basketball</p><button class="form-submit" onclick="addFavoriteTeam('celtics','Boston Celtics','Basketball','Basketball','')">⭐ Thêm yêu thích</button></div></div>`);return}if(page==='favorite-teams'){renderFavoriteTeams();return}if(page==='favorite-sports'){renderFavoriteSports();return}}
function bindSports(){document.querySelectorAll('.sport').forEach(b=>b.onclick=()=>{selectedSport=b.dataset.sport;renderPage('home')})}
document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>renderPage(b.dataset.page));

async function requireUser(){const {data:{session}}=await supabaseClient.auth.getSession();if(!session){openAuth();return null}return session.user}
async function addFavoriteTeam(id,name,sport,league,logo){const user=await requireUser();if(!user)return;const {error}=await supabaseClient.from('favorite_teams').upsert({user_id:user.id,team_id:id,team_name:name,sport_name:sport,league_name:league,team_logo:logo},{onConflict:'user_id,team_id'});alert(error?'❌ '+error.message:'⭐ Đã thêm vào đội yêu thích!');}
async function removeFavoriteTeam(id){const user=await requireUser();if(!user)return;await supabaseClient.from('favorite_teams').delete().eq('user_id',user.id).eq('team_id',id);renderFavoriteTeams()}
async function renderFavoriteTeams(){const user=await requireUser();if(!user)return;const {data,error}=await supabaseClient.from('favorite_teams').select('*').eq('user_id',user.id).order('created_at',{ascending:false});if(error){app.innerHTML=simplePage('⭐ Đội yêu thích','',`<div class="empty">${error.message}</div>`);return}const content=data?.length?data.map(t=>`<div class="favorite-card"><div class="info"><span class="fav-icon">⭐</span><div><strong>${escapeHTML(t.team_name)}</strong><div style="color:var(--muted);font-size:13px">${escapeHTML(t.sport_name||'')} · ${escapeHTML(t.league_name||'')}</div></div></div><button class="remove-btn" onclick="removeFavoriteTeam('${t.team_id}')">Xóa</button></div>`).join(''):'<div class="empty">M chưa có đội yêu thích nào.<br>Vào “Đội / CLB” để thêm đội.</div>';app.innerHTML=simplePage('⭐ Đội yêu thích','Danh sách đội được lưu riêng cho tài khoản của m.',content)}
const favSports=[['Soccer','⚽','Bóng đá'],['Tennis','🎾','Tennis'],['Basketball','🏀','Bóng rổ'],['Volleyball','🏐','Bóng chuyền'],['Hockey','🏒','Hockey'],['Baseball','⚾','Baseball'],['Motorsport','🏎️','Motorsport']];
async function toggleFavoriteSport(sport){const user=await requireUser();if(!user)return;const {data}=await supabaseClient.from('favorite_sports').select('id').eq('user_id',user.id).eq('sport_name',sport);if(data?.length)await supabaseClient.from('favorite_sports').delete().eq('user_id',user.id).eq('sport_name',sport);else await supabaseClient.from('favorite_sports').insert({user_id:user.id,sport_name:sport});renderFavoriteSports()}
async function renderFavoriteSports(){const user=await requireUser();if(!user)return;const {data}=await supabaseClient.from('favorite_sports').select('sport_name').eq('user_id',user.id);const set=new Set((data||[]).map(x=>x.sport_name));app.innerHTML=simplePage('❤️ Môn yêu thích','Chọn các môn m muốn theo dõi thường xuyên.',`<div>${favSports.map(s=>`<button class="sport-fav ${set.has(s[0])?'active':''}" onclick="toggleFavoriteSport('${s[0]}')">${s[1]} ${s[2]} ${set.has(s[0])?'✓':'+'}</button>`).join('')}</div>`)}
function escapeHTML(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

function openAuth(){authModal.classList.add('show');document.getElementById('authMessage').textContent=''}function closeAuth(){authModal.classList.remove('show')}document.getElementById('closeModal').onclick=closeAuth;
document.getElementById('switchAuth').onclick=()=>{registerMode=!registerMode;document.getElementById('authTitle').textContent=registerMode?'Đăng ký':'Đăng nhập';document.getElementById('authSubmit').textContent=registerMode?'Tạo tài khoản':'Đăng nhập';document.getElementById('switchText').textContent=registerMode?'Đã có tài khoản?':'Chưa có tài khoản?';document.getElementById('switchAuth').textContent=registerMode?'Đăng nhập':'Đăng ký';document.getElementById('nameGroup').style.display=registerMode?'block':'none'};

document.getElementById('authSubmit').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,displayName=document.getElementById('displayName').value.trim(),msg=document.getElementById('authMessage'),btn=document.getElementById('authSubmit');if(!email||!password){msg.textContent='⚠️ Hãy nhập email và mật khẩu.';return}btn.disabled=true;msg.textContent='Đang xử lý...';if(registerMode){const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{display_name:displayName}}});if(error)msg.textContent='❌ '+error.message;else{if(data.user)await createProfile(data.user,displayName);msg.textContent='✅ Tạo tài khoản thành công!'}}else{const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)msg.textContent='❌ '+error.message;else{msg.textContent='✅ Đăng nhập thành công!';setTimeout(closeAuth,500)}}btn.disabled=false;updateAccountUI()};
async function createProfile(user,name){await supabaseClient.from('profiles').upsert({id:user.id,username:user.email?.split('@')[0]||null,display_name:name||user.user_metadata?.display_name||user.email})}
async function updateAccountUI(){const {data:{session}}=await supabaseClient.auth.getSession();accountBtn.textContent=session?'Tài khoản':'Đăng nhập';if(session)await createProfile(session.user,session.user.user_metadata?.display_name)}
accountBtn.onclick=async()=>{const {data:{session}}=await supabaseClient.auth.getSession();if(session)userMenu.classList.toggle('show');else openAuth()};
document.getElementById('profileBtn').onclick=async()=>{userMenu.classList.remove('show');const {data:{session}}=await supabaseClient.auth.getSession();if(!session)return;document.getElementById('profileName').textContent=session.user.user_metadata?.display_name||session.user.email?.split('@')[0]||'Người dùng';document.getElementById('profileEmail').textContent='📧 '+session.user.email;document.getElementById('profileId').textContent='ID: '+session.user.id;profileModal.classList.add('show')};
document.getElementById('closeProfile').onclick=()=>profileModal.classList.remove('show');
async function logout(){await supabaseClient.auth.signOut();userMenu.classList.remove('show');profileModal.classList.remove('show');updateAccountUI();if(currentPage.startsWith('favorite-'))renderPage('home')};document.getElementById('logoutBtn').onclick=logout;document.getElementById('profileLogout').onclick=logout;

const searchInput=document.getElementById('searchInput');searchInput.oninput=()=>{const q=searchInput.value.toLowerCase().trim();document.querySelectorAll('[data-search]').forEach(x=>x.style.display=!q||x.dataset.search.toLowerCase().includes(q)?'':'none')};
supabaseClient.auth.onAuthStateChange(()=>updateAccountUI());updateAccountUI();renderPage('home');
</script>
</body>
</html>
